apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: api-python
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/DimShpInt/api_python.git
    targetRevision: main
    path: deploy/base
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: api-python
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
